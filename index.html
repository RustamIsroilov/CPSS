<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AAOIFI CPSS — 4-dars testi</title>
<meta name="theme-color" content="#1b3a6b">
<style>
:root{--bg:#f4f6fa;--panel:#fff;--panel2:#f8fafc;--ink:#12213d;--muted:#63718c;--line:#dde4ee;
--navy:#1b3a6b;--navy-soft:#e7edf7;--gold:#f2b418;--gold-soft:#fdf3d8;
--ok:#17794a;--ok-soft:#e3f4ea;--bad:#c0342b;--bad-soft:#fbe7e5;
--shadow:0 1px 2px rgba(18,33,61,.06),0 8px 24px rgba(18,33,61,.08);--r:16px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--panel:#18202f;--panel2:#1e2737;--ink:#e9edf5;--muted:#94a1b8;
--line:#2a3548;--navy:#5b8ad6;--navy-soft:#16233a;--gold:#e0aa30;--gold-soft:#2b2413;
--ok:#4fbf88;--ok-soft:#152c22;--bad:#f0857c;--bad-soft:#33201e;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
line-height:1.55;padding:0 0 40px}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.htop{display:flex;align-items:center;gap:11px}
.logo{flex:0 0 auto;background:var(--navy);color:#fff;font-weight:800;font-size:12px;letter-spacing:.5px;
padding:7px 10px;border-radius:9px}
.logo span{color:var(--gold)}
.htxt b{display:block;font-size:15px;font-weight:700}
.htxt i{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin:20px 2px 9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.hero{display:flex;align-items:center;gap:16px}
.ring{flex:0 0 62px}
.hero .n{font-size:16px;font-weight:750}
.hero .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:5px;margin-bottom:10px}
.seg button{flex:1 1 auto;min-width:fit-content;white-space:nowrap;border:0;background:transparent;color:var(--muted);
padding:9px 13px;border-radius:9px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
font:inherit;font-size:13.5px;font-weight:650;cursor:pointer}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a2000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--navy);width:0;transition:.25s}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.pill{background:var(--navy-soft);color:var(--navy);border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:750}
.qtop{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.qbox{background:var(--navy-soft);border:1px solid var(--line);border-radius:13px;padding:14px 15px;font-size:15px;font-weight:600;line-height:1.6}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;margin-top:10px;padding:13px 14px;
border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.opt .L{flex:0 0 27px;height:27px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;
font-size:12px;font-weight:750;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)}
.opt.good .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.izoh{margin-top:14px;background:var(--gold-soft);border-radius:12px;padding:13px 14px;font-size:13.5px;line-height:1.65}
.izoh b{color:var(--navy)}
.res{text-align:center;padding:26px 16px}
.res .big{font-size:44px;font-weight:800;margin:6px 0}
.res .emo{font-size:38px}
.banner{border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:650;margin:14px 0}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.no{background:var(--bad-soft);color:var(--bad)}
.rev{margin-top:14px;text-align:left}
.rev .r{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;background:var(--panel2)}
.rev .r .q{font-size:13.5px;font-weight:650}
.rev .r .a{font-size:12.5px;color:var(--muted);margin-top:5px}
.rev .r .a b{color:var(--ok)}
.hidden{display:none}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:9px 2px 0}
footer{margin-top:26px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7}
</style></head><body>

        stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 30 30)"/>

<script>
const Q = [{"t":"2/1","q":"Mijozning mahsulot sotib olish istagi qaysi holatda vaʼda yoki majburiyat deb baholanadi?","o":["Mijoz ogʻzaki suhbatda xohishini aytganda","Istak muayyan oʻrnatilgan (rasmiy) shaklda ifoda etilganda","Mijoz sotuvchidan narxlar toʻgʻrisida maʼlumot olganda","Muassasa mahsulotni sotib olganda"],"c":1,"e":"Muayyan oʻrnatilgan shaklda ifoda etilmagan istak vaʼda yoki majburiyat sifatida baholanmaydi; istak va vaʼdani oʻz ichiga olgan yagona hujjat tuzish esa joiz."},{"t":"2/1","q":"Ssenariy: mol yetkazib beruvchi hech kimning nomiga qaratilmagan umumiy narx-taklifnomasini eʼlon qildi. Mijoz uni muassasaga olib keldi. Ushbu hujjatning sharʼiy maqomi qanday?","o":["Sotuvchining iyjobi — qabul bilan savdo tuziladi","Mijoz zimmasidagi majburiy vaʼda","Maʼlumot (muzokaraga taklif) — iyjob hisoblanmaydi","Muassasa bilan sotuvchi oʻrtasida tuzilgan shartnoma"],"c":2,"e":"Biror tomonga yoʻnaltirilmagan umumiy taklif maʼlumot sifatida qaraladi, iyjob emas. Afzali — taklif muassasa nomiga, amal qilish muddati koʻrsatilgan holda yuborilishi."},{"t":"2/2","q":"Ssenariy: mijoz sotuvchining aynan oʻz nomiga yoʻllangan taklifini qabul qilib boʻldi, soʻngra muassasaga Murobaha soʻrovi bilan keldi. Muassasaning toʻgʻri yoʻli qaysi?","o":["Murobahani amalga oshiradi, chunki narx hali toʻlanmagan","Ushbu mahsulot boʻyicha Murobaha tuzmaydi — savdo mijoz bilan bogʻlangan","Mijoz–sotuvchi shartnomasini oʻz nomiga oʻtkazib oladi","Hamish Jiddiya olib, bitimni davom ettiradi"],"c":1,"e":"Mijoz taklifni qabul qilishi bilan savdo u bilan bogʻlangan hisoblanadi, shu mahsulot uchun Murobaha tuzish joiz emas; tuzilgan shartnomani muassasaga oʻtkazish ham joiz emas."},{"t":"2/2","q":"Ssenariy: mijozning buyurtmasiga binoan muassasa mahsulotni «X» MCHJdan sotib olmoqchi. Tekshiruvda mijoz «X» MCHJ ustav kapitalining 60 foiziga egalik qilishi aniqlandi. Hukm qanday?","o":["Joiz — MCHJ alohida yuridik shaxs hisoblanadi","Joiz — mijozning yozma roziligi olinsa","Makruh, lekin bitim kuchda qoladi","Botil — bu shariatda taqiqlangan Iyna savdosiga olib keladi"],"c":3,"e":"Sotuvchi mijozning oʻzi, vakili yoki mijoz 50% dan ortigʻiga egalik qiluvchi korxona boʻlishi mumkin emas; shunday savdo oshkor boʻlsa, bitim botil boʻladi."},{"t":"2/2","q":"Quyidagi amaliyotlardan qaysi biri joiz hisoblanadi?","o":["Valyutani kechiktirilgan toʻlov asosidagi Murobaha orqali sotish","Asosiy aktivlari Murobaha qarzlaridan iborat ayirboshlanadigan sukuk chiqarish","Ayni mijoz bilan ayni mahsulot ustida Murobaha shartnomasini yangilash","Kumushni naqd (spot) shartlarda sotib olish"],"c":3,"e":"Oltin, kumush va valyutada taqiq nasiya Murobahaga tegishli; naqd asosdagi ayirboshlash bu taqiq doirasiga kirmaydi. Qolgan ikki amaliyot ham shu bandda man etilgan."},{"t":"2/3","q":"Mijozning sotib olish vaʼdasini ifodalovchi hujjatda quyidagilardan qaysi biri boʻlishi joiz emas?","o":["Mijozning bir tomonlama vaʼdasi","Mahsulotning batafsil tavsifi","Ikki tomonga ham majburiyat yuklovchi, xiyorsiz vaʼdalashuv","Kutilayotgan toʻlov muddati koʻrsatmasi"],"c":2,"e":"Hujjat ikkala tomonga majburiyat yuklaydigan vaʼdalashuvni oʻz ichiga olishi joiz emas; bunday ikki tomonlama vaʼda xiyor sharti boʻlgandagina joiz boʻladi."},{"t":"2/3","q":"Muassasa va mijoz oʻrtasidagi ikki tomonlama vaʼdalashuv qaysi shart bilan joiz boʻladi?","o":["Muassasa Shariat kengashi uni yozma tasdiqlasa","Tomonlardan birida yoki ikkisida vaʼdani bekor qilish huquqi (xiyor ash-shart) boʻlsa","Mijoz Hamish Jiddiya toʻlagan boʻlsa","Vaʼda notarial idorada tasdiqlansa"],"c":1,"e":"Ikki tomonlama vaʼdalashuv vaʼda beruvchilarning ikkisida yoki birida vaʼdani bekor qilish huquqi mavjud boʻlgandagina joiz."},{"t":"2/3","q":"Ssenariy: mijoz vaʼda berganidan soʻng, Murobaha imzolanishidan oldin bozor sharoiti oʻzgardi. Muassasa vaʼdada kelishilgan foyda darajasini qayta koʻrib chiqmoqchi. Toʻgʻri hukm qaysi?","o":["Shartnoma hali tuzilmagani uchun muassasa bir tomonlama oʻzgartiradi","Vaʼda shartlari hech bir holatda qayta koʻrilmaydi","Har ikki tomonning oʻzaro roziligi bilan oʻzgartirish joiz","Oʻzgartirish uchun ustama bozor indeksiga bogʻlab qoʻyiladi"],"c":2,"e":"Vaʼda bosqichidan keyin, bitim imzolangunga qadar muddat, foyda darajasi va boshqa shartlarni oʻzgartirish mumkin, biroq bu ikkala tomonning roziligi bilangina amalga oshadi."},{"t":"2/4","q":"Muassasa mijozni moliyalashtirish boʻyicha zimmasiga majburiyat olgani uchun haq (commitment fee) olishi mumkinmi?","o":["Mumkin — maʼmuriy xarajatlar qoplami sifatida","Mumkin — shartnomada ochiq yozilgan boʻlsa","Mumkin emas — bunday haq olish joiz emas","Mumkin — sindikatlashgan moliyalashtirishda"],"c":2,"e":"Moliyalashtirish majburiyati uchun ham, moliyalashtirish imkoniyati taqdim etilgani uchun ham haq olish joiz emas; shartnoma hujjatlari xarajatlari esa ish koʻlamiga mutanosib boʻlishi shart."},{"t":"2/4","q":"Ssenariy: Murobaha bir nechta sarmoyador ishtirokidagi sindikat orqali amalga oshirilmoqda. Tashkilotchi muassasa xizmat haqiga haqlimi va uni kim toʻlaydi?","o":["Haqli emas — har qanday tashkiliy haq taqiqlanadi","Haqli — haqni mijoz toʻlaydi","Haqli — haqni sindikat ishtirokchilari toʻlaydi","Haqli — haq mahsulot tannarxiga qoʻshib mijozdan undiriladi"],"c":2,"e":""},{"t":"2/5","q":"Hamish Jiddiya va urbun oʻrtasidagi farq boʻyicha toʻgʻri hukm qaysi?","o":["Hamish Jiddiya vaʼda bosqichida, urbun bitim imzolanganda olinadi","Ikkisi ham vaʼda bosqichida olinadi","Urbun vaʼda bosqichida, Hamish Jiddiya bitim imzolanganda olinadi","Ikkisi ham bitim imzolanganda olinadi"],"c":0,"e":"Hamish Jiddiya majburiy vaʼda bosqichida jiddiylik kafolati sifatida olinadi; urbunni esa vaʼda bosqichida olish joiz emas — u bitim imzolanganda olinadi."},{"t":"2/5","q":"Ssenariy: mijoz majburiy vaʼdasini buzdi. Mahsulot muassasaga 100 000 birlikka tushgan, u uchinchi tomonga 92 000 ga sotildi; kutilgan Murobaha foydasi 15 000 edi. Hamish Jiddiyadan ushlab qolish mumkin boʻlgan eng koʻp miqdor qancha?","o":["23 000 — zarar va boy berilgan foyda yigʻindisi","8 000 — tannarx bilan uchinchi tomonga sotish narxi farqi","15 000 — boy berilgan foyda","100 000 — mahsulotning toʻliq tannarxi"],"c":1,"e":"Ushlab qolish haqiqiy zarar — tannarx (100 000) va uchinchi tomonga sotish narxi (92 000) oʻrtasidagi farq, yaʼni 8 000 bilan cheklanadi; boy berilgan imkoniyat (foyda) unga kirmaydi."},{"t":"2/5","q":"Mijoz vaʼdasida turib Murobaha shartnomasini imzoladi. Hamish Jiddiyaning taqdiri qanday boʻladi?","o":["Muassasaning qoʻshimcha daromadi boʻlib qoladi","Toʻligʻicha xayriyaga yoʻnaltiriladi","Mijozga qaytariladi yoki kelishuv asosida narxdan ayiriladi","Qarz toʻliq uzilguncha muassasada majburiy saqlanadi"],"c":1,"e":"Vaʼda bajarilganda muassasa Hamish Jiddiyani qaytarishi shart; bitim imzolanayotganda uni mahsulot narxidan ayirish boʻyicha kelishish ham joiz."},{"t":"3/1","q":"Muassasa mijoz bilan Murobaha bitimini qachon imzolashi toʻgʻri boʻladi?","o":["Mijoz majburiy vaʼda bergandan soʻng darhol","Sotuvchi bilan shartnoma tuzilib, mahsulot haqiqiy yoki hukmiy qabz qilingandan soʻng","Mijoz Hamish Jiddiyani toʻlaganidan soʻng","Sotuvchiga narx toʻlangandan soʻng, qabzdan oldin"],"c":1,"e":"Egalikka olinmagan mahsulotni Murobaha asosida sotish man etiladi: avval xarid shartnomasi, soʻng haqiqiy yoki hukmiy qabz, keyin Murobaha."},{"t":"3/1","q":"Mahsulotni sotib olish uchun xarid buyurtmachisi boʻlgan mijozning oʻzini vakil qilish hukmi qanday?","o":["Hech bir holatda joiz emas","Har qanday holatda joiz","Oʻta zarur holatlardagina joiz","Sotuvchining roziligi boʻlsa joiz"],"c":2,"e":"Asl qoida — muassasaning oʻzi sotib oladi; uchinchi shaxsni vakil qilish mumkin, mijozning oʻzini esa oʻta zarur holatlardagina vakil qilish mumkin."},{"t":"3/1","q":"Ssenariy: mijoz muassasa vakili sifatida mahsulot sotib oldi. Muassasa narxni mijozning hisobraqamiga oʻtkazdi, mijoz sotuvchiga toʻladi; soʻng ayni lahzada, vakillik bajarilgani haqida xabarnomasiz, Murobaha imzolandi. Qaysi talablar buzilgan?","o":["Narxni sotuvchiga bevosita toʻlash va ikki javobgarlikni vaqt bilan ajratish talablari","Hech qaysi — jarayon toʻgʻri tashkil etilgan","Mijozni vakil tayinlashning oʻzi mutlaqo man etilgani","Sugʻurtani muassasa hisobidan amalga oshirish majburiyati"],"c":0,"e":""},{"t":"3/2","q":"Muassasa xalqaro bozordan mahsulot sotib olayotganda konnosamentni qabul qilib oldi. Bu sharʼiy jihatdan qanday baholanadi?","o":["Qabz hisoblanmaydi — jismoniy topshirish talab qilinadi","Hukmiy (konstruktiv) qabz hisoblanadi","Haqiqiy qabz hisoblanadi","Kafolat vositasi hisoblanadi, qabzga aloqasi yoʻq"],"c":1,"e":"Konnosamentni yoki omborda saqlash hujjatlarini qabul qilib olish hukmiy qabz hisoblanadi — jismoniy topshirishsiz ham mahsulot muassasa javobgarligiga oʻtadi."},{"t":"4 -bo‘lim","q":"Murobaha narxini hisoblashda tannarxga kiritish joiz boʻlgan xarajat qaysi?","o":["Muassasa xodimlariga toʻlangan ish haqi","Uchinchi tomonga toʻlangan transport va saqlash xarajatlari","Moliyalashtirish imkoniyati uchun belgilangan haq","Kutilgan, ammo boy berilgan foyda"],"c":1,"e":"Tannarxga uchinchi tomonlarga toʻlangan bevosita xarajatlargina kiritiladi; oʻz xodimlari mehnati uchun toʻlovlarni qoʻshish joiz emas, ochiqlanmagan xarajatlar esa urfda odatiy sanaladiganlardan boshqasi kiritilmaydi."},{"t":"4 -bo‘lim","q":"Murobaha shartnomasi imzolanganidan keyin dastlabki sotuvchi muassasaga oʻsha mahsulot uchun chegirma berdi. Toʻgʻri hukm qaysi?","o":["Chegirma toʻligʻicha muassasaga tegishli","Mijoz chegirmadan mutanosib ravishda manfaat olishi — Murobaha narxi kamaytirilishi kerak","Shartnoma bekor qilinib, qayta tuziladi","Chegirma xayriya jamgʻarmasiga oʻtkaziladi"],"c":1,"e":"Chegirma shartnomadan keyin olingan boʻlsa ham, mijoz undan manfaat olishi kerak: umumiy sotuv narxi chegirmaga mutanosib kamaytiriladi."},{"t":"5 -bo‘lim","q":"Mijoz uzrsiz davriy toʻlovni kechiktirsa, muassasa nima qilishga haqli?","o":["Kechikkan kunlar uchun oʻz foydasiga penya undiradi","Qarz miqdorini bir tomonlama oshiradi","Shartnomada kelishilgan boʻlsa, xayriyaga yoʻnaltiriladigan toʻlov majburiyatini qoʻllaydi; oʻz foydasiga qoʻshimcha undirmaydi","Mahsulotni soʻzsiz qaytarib oladi"],"c":2,"e":"Kechikkanda muassasa qarz miqdorinigina undirishga haqli; oʻz foydasiga qoʻshimcha yuklay olmaydi. Shartnomada kechikkanda xayriyaga beriladigan toʻlov shart qilinishi mumkin — sarflanishini Shariat kengashi nazorat qiladi."},{"t":"5 -bo‘lim","q":"Ssenariy: toʻlovga qiynalayotgan mijoz restrukturizatsiya soʻradi; muassasa muddatni uzaytirish evaziga qarzni 5 foizga oshirishni taklif qildi. Hukm qanday?","o":["Mijoz rozi boʻlsa, joiz","Mijoz toʻlovga qodir boʻlmasa, joiz","Joiz emas — qarz miqdorini oshirish evaziga muddatni uzaytirish mumkin emas","Shariat kengashining ruxsati bilan joiz"],"c":2,"e":"Qarzdorning toʻlovga qodir yoki qodir emasligidan qatʼi nazar, qarzni oshirish evaziga muddatni uzaytirish (shunday restrukturizatsiya) mumkin emas."},{"t":"5 -bo‘lim","q":"Mijoz qarzini muddatidan oldin toʻladi. Muassasa sotuv narxining bir qismidan voz kechishi mumkinmi?","o":["Mumkin — bu shartnomada oldindan kelishilmagan boʻlsa","Mumkin — bu shartnomada yozilgan boʻlishi shart","Mumkin emas — bu riboga olib keladi","Mumkin emas — narx oʻzgarmas hisoblanadi"],"c":0,"e":"Muddatidan oldin toʻlovda narxning bir qismidan voz kechish joiz, biroq bu shartnoma sharti sifatida oldindan kelishilgan boʻlmasligi lozim."},{"t":"3 -bo‘lim","q":"Ssenariy: anʼanaviy bank muassasaga Tavarruq orqali likvidlik olish uchun murojaat qildi. Muassasaga olinadigan mablagʻ foizli kreditlashga yoʻnaltirilishi maʼlum boʻldi. Muassasaning toʻgʻri yoʻli qaysi?","o":["Amaliyotni bajaradi — mablagʻning ishlatilishi uning javobgarligiga kirmaydi","Bunday bank manfaati uchun Tavarruqni amalga oshirmaydi","Foiz daromadidan ulush olish sharti bilan bajaradi","Mablagʻ miqdorini kamaytirib bajaradi"],"c":1,"e":"Olingan likvidlik shariatga muvofiq amaliyotlar oʻrniga foizli kreditlashga ishlatilishi maʼlum boʻlsa, muassasa anʼanaviy banklar manfaati uchun Tavarruqni amalga oshirmasligi kerak."},{"t":"4 -bo‘lim","q":"Quyidagilardan qaysi biri Tavarruq predmeti (sotiladigan mahsulot) boʻla oladi?","o":["Oltin","Xorijiy valyuta","Omborda saqlanayotgan, hujjatlari bilan aniqlangan metall (alyuminiy)","Kumush"],"c":2,"e":"Sotiladigan mahsulot oltin, kumush yoki har qanday turdagi valyuta boʻlmasligi kerak; sotuvchi egaligidagi, aniq belgilangan haqiqiy tovar esa Tavarruq predmeti boʻla oladi."},{"t":"4 -bo‘lim","q":"Ssenariy: muassasa umumiy zaxiradan ajratilmagan, sertifikat raqamlari qayd etilmagan metallni sotib olib, mijozga Murobaha orqali sotdi. Hujjatlarga koʻra mahsulot mijoz qabz qilmasidan turib, avtomatik ravishda uchinchi tomonga sotiladi. Qaysi talablar buzilgan?","o":["Mahsulotni aniqlashtirish, xaridor qabzi va ikki shartnomani bogʻlamaslik talablari","Talablar buzilmagan — jarayon toʻgʻri tashkil etilgan","Uchinchi tomonga sotish taqiqi","Majburiy vaʼdaning ikki tomonlama boʻlishi talabi"],"c":0,"e":"Mahsulot sotuvchining boshqa aktivlaridan ajratib aniqlanishi (4/2), xaridor tomonidan haqiqiy yoki hukmiy qabz qilinishi (4/4) va ikki savdo shartnomasi mijoz qabz huquqidan mahrum boʻladigan tarzda bogʻlanmasligi (4/6) shart — uchalasi ham buzilgan."},{"t":"4 -bo‘lim","q":"Mijoz muassasadan sotib olgan Tavarruq mahsulotini sotishga kimni vakil qilishi mumkin?","o":["Har qanday holatda ayni oʻsha muassasani","Muassasa tashkil etib bergan uchinchi tomonni","Oʻzidan boshqa hech kimni — vakillik butunlay man etilgan","Muassasadan boshqa vakilni; tartib-qoidalar boshqa imkon bermasa, qabzdan keyin muassasani ham"],"c":3,"e":"Asl qoida: mijoz mahsulotni oʻzi yoki muassasadan boshqa vakil orqali sotadi (4/9); muassasani vakil qilish joiz emas (4/7), muassasa uchinchi tomon vakilligini ham tashkil etmaydi (4/8). Istisno — tartib-qoidalar majbur qilsa, qabzdan keyin muassasaga vakillik berish mumkin."},{"t":"5 -bo‘lim","q":"Muassasaning oʻzi (mutavarriq sifatida) Tavarruqqa qachon murojaat qilishi toʻgʻri boʻladi?","o":["Doimiy ravishda — likvidlik jalb qilishning asosiy vositasi sifatida","Amaliyotlar oqimini toʻxtatib, mijozlarga zarar yetkazishi mumkin boʻlgan likvidlik tanqisligi xavfi yuzaga kelganda","Foydalilik koʻrsatkichlarini oshirish zarur boʻlganda","Har chorakda, reja asosida"],"c":1,"e":"Tavarruq investitsiya yoki moliyalashtirish usuli emas — u ehtiyoj uchun ruxsat etilgan. Muassasa unga likvidlik tanqisligi amaliyotlarni toʻxtatish va mijozlarga zarar yetkazish xavfini tugʻdirgandagina murojaat qiladi; Muzoraba, sukuk kabi usullar orqali mablagʻ jalb qilish saʼy-harakati davom etadi."},{"t":"5 -bo‘lim","q":"Ssenariy: muassasa mutavarriq sifatida sotib olgan mahsulotini sotish uchun uchinchi tomon bilan vakillik shartnomasi tuzmoqchi. Hukm qanday?","o":["Joiz — uchinchi tomon mustaqil shaxs hisoblanadi","Joiz — mijozning roziligi olinsa","Vakillikdan saqlanish kerak: sotish oʻz tuzilmasi orqali amalga oshiriladi, brokerdan foydalanish esa joiz","Joiz emas — brokerdan foydalanish ham man etilgan"],"c":2,"e":"Muassasa oʻzi manfaat oluvchi boʻlganda Tavarruq mahsulotini sotishda vakillikdan — uchinchi tomon bilan boʻlsa ham — saqlanadi va sotishni oʻz tuzilmalari orqali amalga oshiradi; broker (dallol) xizmatidan foydalanish esa bunga zid emas."}];
const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const KEY='mezon.cpss.4dars.v1';
let st={best:{},seen:{},wrong:{},done:0};
try{ const s=localStorage.getItem(KEY); if(s) st=Object.assign(st,JSON.parse(s)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

const TOPICS = [...new Set(Q.map(q=>q.t))];
let topic='Hammasi', ses=null;

function renderHome(){
  ['quiz','done','list'].forEach(i=>$('#'+i).classList.add('hidden'));
  $('#home').classList.remove('hidden');
  const seg=$('#topicSeg');
  seg.innerHTML=['Hammasi',...TOPICS].map(t=>
    `<button data-t="${esc(t)}" class="${t===topic?'on':''}">${esc(t)}</button>`).join('');
  $$('#topicSeg button').forEach(b=>b.onclick=()=>{ topic=b.dataset.t; renderHome(); });
  const pool=poolOf();
  $('#topicNote').textContent = topic==='Hammasi'
    ? Q.length+' ta savol — barcha mavzular bo‘yicha aralash.'
    : pool.length+' ta savol — faqat «'+topic+'» mavzusi.';
  const answered=Object.keys(st.seen).length;
  const right=Object.values(st.seen).filter(v=>v===1).length;
  const pct = answered? Math.round(right/answered*100):0;
  $('#ringc').style.strokeDashoffset=(163.4*(1-pct/100)).toFixed(1);
  $('#ringv').textContent=pct+'%';
  $('#heroT').textContent = answered ? right+' / '+answered+' to‘g‘ri' : Q.length+' ta savol';
  $('#heroD').textContent = answered ? 'Jami '+Q.length+' savoldan '+answered+' tasi ishlangan' : 'Hali ishlanmadi';
  const w=Object.keys(st.wrong).length;
  $('#wN').textContent=w; $('#bWrong').disabled = w===0;
  const rows=TOPICS.map(t=>{
    const ids=Q.map((q,i)=>[q,i]).filter(([q])=>q.t===t).map(([,i])=>i);
    const a=ids.filter(i=>st.seen[i]!==undefined).length;
    const r=ids.filter(i=>st.seen[i]===1).length;
    return `<div class="meta" style="padding:7px 0;border-bottom:1px solid var(--line)">
      <span style="color:var(--ink);font-weight:650">${esc(t)}</span>
      <span>${a? r+'/'+a+' to‘g‘ri' : '—'} <span class="pill">${ids.length} savol</span></span></div>`;
  }).join('');
  $('#stats').innerHTML=rows;
}
function poolOf(){ return Q.map((q,i)=>i).filter(i=>topic==='Hammasi'||Q[i].t===topic); }

function startQuiz(ids){
  if(!ids.length){ alert('Savol topilmadi.'); return; }
  ses={ids:shuffle(ids.slice()), i:0, right:0, log:[]};
  ['home','done','list'].forEach(i=>$('#'+i).classList.add('hidden'));
  $('#quiz').classList.remove('hidden');
  step(); window.scrollTo(0,0);
}
function step(){
  const id=ses.ids[ses.i], q=Q[id];
  $('#qTop').textContent = q.t+' · '+(ses.i+1)+'-savol';
  $('#qText').textContent = q.q;
  $('#qIzoh').classList.add('hidden');
  $('#bNext').disabled=true;
  $('#bNext').textContent = ses.i===ses.ids.length-1 ? 'Yakunlash' : 'Keyingisi';
  const order=shuffle([0,1,2,3]);
  const c=$('#qOpts'); c.innerHTML='';
  order.forEach((oi,n)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML='<span class="L">'+'ABCD'[n]+'</span><span>'+esc(q.o[oi])+'</span>';
    b.onclick=()=>{
      const ok = oi===q.c;
      $$('#qOpts .opt').forEach((x,k)=>{ x.disabled=true;
        if(order[k]===q.c) x.classList.add('good'); });
      if(!ok) b.classList.add('bad');
      if(ok){ ses.right++; st.seen[id]=1; delete st.wrong[id]; }
      else { st.seen[id]=0; st.wrong[id]=(st.wrong[id]||0)+1; }
      save();
      ses.log.push({id, ok});
      if(q.e){ $('#qIzoh').innerHTML='<b>Izoh.</b> '+esc(q.e); $('#qIzoh').classList.remove('hidden'); }
      $('#bNext').disabled=false;
      $('#qScore').textContent='To‘g‘ri: '+ses.right+' / '+(ses.i+1);
    };
    c.appendChild(b);
  });
  $('#qBar').style.width=(ses.i/ses.ids.length*100)+'%';
  $('#qCount').textContent=(ses.i+1)+' / '+ses.ids.length;
  $('#qScore').textContent = ses.i? 'To‘g‘ri: '+ses.right+' / '+ses.i : '';
  window.scrollTo(0,0);
}
$('#bNext').onclick=()=>{ ses.i++; if(ses.i>=ses.ids.length) finish(); else step(); };
$('#bQuit').onclick=()=>{ renderHome(); };

function finish(){
  ['home','quiz','list'].forEach(i=>$('#'+i).classList.add('hidden'));
  $('#done').classList.remove('hidden');
  const n=ses.ids.length, pct=Math.round(ses.right/n*100), ok=pct>=70;
  $('#dEmo').textContent = pct>=90?'🏅':ok?'🎉':'💪';
  $('#dPct').textContent=pct+'%';
  $('#dPct').style.color = ok?'var(--ok)':'var(--bad)';
  $('#dH').textContent=ses.right+' / '+n+' to‘g‘ri javob';
  const ban=$('#dBan');
  ban.className='banner '+(ok?'ok':'no');
  ban.textContent = pct===100 ? 'Barcha savollar to‘g‘ri — ajoyib!'
    : ok ? 'Yaxshi natija. Xato qilganlaringizni takrorlang.'
         : 'Mavzuni qayta ko‘rib chiqish tavsiya etiladi.';
  const bad=ses.log.filter(x=>!x.ok);
  $('#dAgain').disabled = bad.length===0;
  $('#dAgain').onclick=()=>startQuiz(bad.map(x=>x.id));
  $('#dRev').innerHTML = bad.length
    ? '<div class="lbl">Xato qilingan savollar</div>'+bad.map(x=>{
        const q=Q[x.id];
        return `<div class="r"><div class="q">${esc(q.q)}</div>
          <div class="a">To‘g‘ri javob: <b>${esc(q.o[q.c])}</b></div>
          ${q.e?`<div class="a">${esc(q.e)}</div>`:''}</div>`;
      }).join('')
    : '';
  save(); window.scrollTo(0,0);
}
$('#dHome').onclick=renderHome;
$('#bStart').onclick=()=>startQuiz(poolOf());
$('#bWrong').onclick=()=>startQuiz(Object.keys(st.wrong).map(Number));
$('#bReset').onclick=()=>{ if(confirm('Barcha natijalar o‘chirilsinmi?')){ st={best:{},seen:{},wrong:{},done:0}; save(); renderHome(); } };
$('#lHome').onclick=renderHome;
$('#bAll').onclick=()=>{
  ['home','quiz','done'].forEach(i=>$('#'+i).classList.add('hidden'));
  $('#list').classList.remove('hidden');
  $('#listBody').innerHTML = Q.map((q,i)=>`<div class="card" style="margin-bottom:10px">
    <div class="qtop">${esc(q.t)} · ${i+1}</div>
    <div style="font-weight:650;font-size:14px">${esc(q.q)}</div>
    ${q.o.map((o,k)=>`<div class="opt" style="cursor:default;${k===q.c?'background:var(--ok-soft);border-color:var(--ok)':''}">
       <span class="L" ${k===q.c?'style="background:var(--ok);border-color:var(--ok);color:#fff"':''}>${'ABCD'[k]}</span><span>${esc(o)}</span></div>`).join('')}
    ${q.e?`<div class="izoh"><b>Izoh.</b> ${esc(q.e)}</div>`:''}
  </div>`).join('');
  window.scrollTo(0,0);
};
renderHome();
</script></body></html>
